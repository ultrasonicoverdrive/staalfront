# Determinism: iteration order of std hash collections is not stable.
# Use BTreeMap/BTreeSet or sorted vectors instead (PLAN.md section 5, rule 3).
# A copy of crates/sf_sim/clippy.toml: the AI follows the simulation's rules.
disallowed-types = [
    { path = "std::collections::HashMap", reason = "iteration order is not deterministic; use BTreeMap or a sorted Vec" },
    { path = "std::collections::HashSet", reason = "iteration order is not deterministic; use BTreeSet or a sorted Vec" },
]
