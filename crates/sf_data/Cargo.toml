[package]
name = "sf_data"
description = "Unit, building and weapon definitions (RON): validation and loading."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
sf_math = { path = "../../crates/sf_math" }
# RON header of the map format (project-wide data format, PLAN.md 1.0).
ron = "0.12"
# Derive for the map header.
serde = { version = "1", features = ["derive"] }
# 16-bit heightmap and 8-bit material map files of the map format.
png = "0.18.1"

[dev-dependencies]
# Tests only: keeps the 20 Hz constants of the definitions equal to the
# simulation's (a path dependency, not a new external crate; sf_sim does not
# depend on sf_data).
sf_sim = { path = "../../crates/sf_sim" }
