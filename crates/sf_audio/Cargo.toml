[package]
name = "sf_audio"
description = "Sound, voices and music."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Mixing, panning, fades. 0.12.5 is the current stable line. Default features
# are off to keep codecs minimal: WAV (+ PCM decoding) and OGG Vorbis only;
# `cpal` is the real output backend. `cpal-realtime(-dbus)` is left out: it
# only adds thread-priority tweaks and a libdbus system dependency.
kira = { version = "0.12.5", default-features = false, features = ["cpal", "wav", "pcm", "ogg", "vorbis"] }
# Derive for the RON-backed sound bank.
serde = { version = "1", features = ["derive"] }
# Project-wide data format (PLAN.md 1.0).
ron = "0.12"
# WP11.7 (optional original Red Alert audio, B11). RSA step of encrypted MIX
# headers: one modular exponentiation on a 320-bit number. Pure Rust, MIT/Apache.
num-bigint = "0.4.6"
# Blowfish block cipher for encrypted MIX headers (RustCrypto, MIT/Apache).
# 0.9 is the stable line on cipher 0.4.
blowfish = "0.9.1"
