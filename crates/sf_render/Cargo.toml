[package]
name = "sf_render"
description = "wgpu rendering: terrain, models, camera, zoom, effects and LOD."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# `render` enables sf_math::render_bridge, the only fixed-point to f32 conversion.
sf_math = { path = "../../crates/sf_math", features = ["render"] }
# Engine map format (header, heightmap, material map) the terrain is built from.
sf_data = { path = "../../crates/sf_data" }
# GPU API (Vulkan/DX12/Metal); 30.x is the current stable line (PLAN.md 1.0).
wgpu = "30.0.1"
# Render math (matrices for the placeholder view/projection); presentation only.
glam = "0.34.1"
# Safe casts of vertex/uniform structs to bytes for buffer uploads.
bytemuck = { version = "1.25", features = ["derive"] }
# PNG encode/decode for offscreen screenshots and golden images.
png = "0.18.1"
# Block on wgpu's async adapter/device requests without an async runtime.
pollster = "1.0.1"
# The placeholder unit style (palette, shapes) is a RON file (PLAN.md section 5
# rule 6); both crates are already in the workspace (sf_engine, sf_data).
serde = { version = "1", features = ["derive"] }
ron = "0.12"
# Debug overlay (WP1.11): egui draws the F1 panels; egui-wgpu is the matching
# painter for our wgpu 30. Versions 0.36.x are the only egui line whose
# egui-wgpu requires wgpu ^30. Default features are off: they only add
# wgpu backends/targets we already configure (macOS jitter fix can return
# with the macOS port).
egui = { version = "0.36.2", default-features = false, features = ["default_fonts"] }
egui-wgpu = { version = "0.36.2", default-features = false }
