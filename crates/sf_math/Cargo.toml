[package]
name = "sf_math"
description = "Fixed-point numbers, vectors, angles and the deterministic RNG."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# `lints.workspace = true` cannot be combined with extra lints, so the
# workspace lints are repeated here (same float lints as sf_sim). The only
# module allowed to touch floats is `render_bridge`, which opts out locally.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
float_arithmetic = "deny"
float_cmp = "deny"
float_cmp_const = "deny"
cast_precision_loss = "deny"

# No runtime dependencies: sf_math is `no_std` and shared by the simulation,
# the renderer and the tools.
[dependencies]

[features]
# Float conversion at the rendering boundary (`sf_math::render_bridge`). Off by
# default and never enabled by sf_sim: with the feature off the module does not
# exist, so the compiler (not just the lint script) stops the simulation from
# reaching for floats. Presentation-side crates (sf_render, sf_ui, ...) enable it
# with `sf_math = { path = "...", features = ["render"] }`.
render = []

[dev-dependencies]
# sf_math's own tests exercise `render_bridge`, so they need the feature. A
# self dev-dependency turns it on for `cargo test -p sf_math` only (it is not
# built when another crate, such as sf_sim, is the package under test).
sf_math = { path = ".", features = ["render"] }
# Property-based tests. Default features (fork, timeout, bit-set) are off:
# they pull in process-forking and tempfile machinery we do not use.
proptest = { version = "1.12", default-features = false, features = ["std"] }
