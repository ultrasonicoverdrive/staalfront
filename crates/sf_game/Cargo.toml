[package]
name = "sf_game"
description = "The game binary: glues all crates together."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
sf_math = { path = "../../crates/sf_math", features = ["render"] }
sf_sim = { path = "../../crates/sf_sim" }
sf_data = { path = "../../crates/sf_data" }
sf_ai = { path = "../../crates/sf_ai" }
sf_engine = { path = "../../crates/sf_engine" }
sf_render = { path = "../../crates/sf_render" }
sf_ui = { path = "../../crates/sf_ui" }
sf_audio = { path = "../../crates/sf_audio" }
sf_cutscene = { path = "../../crates/sf_cutscene" }
sf_net = { path = "../../crates/sf_net" }
# F1 debug panels (WP1.11): the UI itself and the winit event/platform glue.
# 0.36.x matches wgpu 30 (egui-wgpu in sf_render) and winit 0.30.13. Default
# features off: no clipboard (arboard) and no link opening (webbrowser); the
# window system backends are already enabled through winit in sf_engine.
egui = { version = "0.36.2", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "0.36.2", default-features = false, features = ["x11", "wayland"] }
