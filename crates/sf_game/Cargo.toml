[package]
name = "sf_game"
description = "The game binary: glues all crates together."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# Library plus two binaries (WP1.14): the whole game shell lives in the library
# ([`run`]); `sf_game` (this crate's `main.rs`) and `sf_demo` (tools/sf_demo)
# only choose the defaults ([`Preset`]). See the crate docs.
[lib]
name = "sf_game"
path = "src/lib.rs"

[[bin]]
name = "sf_game"
path = "src/main.rs"

[dependencies]
sf_math = { path = "../../crates/sf_math", features = ["render"] }
sf_sim = { path = "../../crates/sf_sim" }
sf_data = { path = "../../crates/sf_data" }
# The copy of the unit definitions into the simulation's unit table (WP3.2), shared with sf_headless.
sf_bridge = { path = "../../crates/sf_bridge" }
sf_ai = { path = "../../crates/sf_ai" }
sf_engine = { path = "../../crates/sf_engine" }
sf_render = { path = "../../crates/sf_render" }
sf_ui = { path = "../../crates/sf_ui" }
sf_audio = { path = "../../crates/sf_audio" }
sf_cutscene = { path = "../../crates/sf_cutscene" }
sf_net = { path = "../../crates/sf_net" }
# The command record (WP1.16a, `--record`) is written as an sf_headless scenario, with the types and the
# writer that sf_headless reads it back with, so the file format has one definition. The threaded sim is
# also checked tick by tick against the headless runner (tests/sim_thread.rs). A workspace crate, not a
# new external dependency; it depends on no rendering crate, so nothing cycles.
sf_headless = { path = "../../tools/sf_headless" }
# F1 debug panels (WP1.11): the UI itself and the winit event/platform glue.
# 0.36.x matches wgpu 30 (egui-wgpu in sf_render) and winit 0.30.13. Default
# features off: no clipboard (arboard) and no link opening (webbrowser); the
# window system backends are already enabled through winit in sf_engine.
egui = { version = "0.36.2", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "0.36.2", default-features = false, features = ["x11", "wayland"] }
# Benchmark file (`sf_demo --bench`, WP1.14): bench.json is written with
# serde_json from derived structs, so it is always valid JSON and the keys keep
# their declaration order. Both crates are already in the lockfile (egui, kira
# and ron use them); no new crate is added.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# assets/config/wrecks.ron (WP5.5, how wrecks and rubble are drawn) is parsed here. ron 0.12 is already
# in the lockfile (sf_data and sf_render use it); no new crate is added.
ron = "0.12"

# The CPU time of the main thread, read with `GetThreadTimes` (WP1.16a, the hitch log: a long frame with
# little CPU time means the thread was not running). Windows only. The crate is already in the lockfile
# (winit, wgpu and kira use it); `Win32_System_Threading` has the call and `Win32_Foundation` the
# `FILETIME` and `HANDLE` types in its signature.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
