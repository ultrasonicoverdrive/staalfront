[workspace]
resolver = "3"
members = [
    "crates/sf_math",
    "crates/sf_sim",
    "crates/sf_data",
    "crates/sf_bridge",
    "crates/sf_ai",
    "crates/sf_engine",
    "crates/sf_render",
    "crates/sf_ui",
    "crates/sf_audio",
    "crates/sf_cutscene",
    "crates/sf_net",
    "crates/sf_thread_cpu",
    "crates/sf_game",
    "tools/sf_editor",
    "tools/sf_headless",
    "tools/sf_demo",
    "tools/sf_ra_extract",
    "tools/sf_asset_check",
    "tools/sf_icon_gen",
    "tools/sf_sound_gen",
    "tools/sf_model_gen",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

# The model generator bakes ambient occlusion by ray casting (WP11.6a); unoptimised it takes
# minutes per run, and its pin test runs it in every `cargo test`.
[profile.dev.package.sf_model_gen]
opt-level = 3
