name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - name: Software Vulkan driver (Mesa lavapipe) for the screenshot tests; ALSA headers for sf_audio (kira/cpal); Xvfb for the demo smoke test
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libasound2-dev xvfb
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # --nocapture prints the adapter the screenshot tests used (lavapipe / WARP).
      - if: runner.os != 'Windows'
        run: cargo test --workspace -- --nocapture
      # On Windows the GPU tests run one at a time: DX12 WARP crashed with
      # STATUS_ACCESS_VIOLATION (0xc0000005) twice in a row when several screenshot
      # tests created devices in parallel threads (PR #18, run 39009873035, in
      # debug_overlay and camera_screenshot). Same tests, serial; see progress.md.
      - if: runner.os == 'Windows'
        run: cargo test --workspace -- --nocapture --test-threads=1
      # WP1.14: the engine demo as a smoke test on the software adapter (lavapipe
      # on Linux under Xvfb, WARP on Windows): three screenshots of the window
      # (close-up, middle with the F1 panels, whole map) and a short benchmark
      # flight to keep the bench.json path working. No fps is asserted: this
      # hardware is software. `--windowed` because a CI display cannot do
      # 1920x1080 fullscreen. The numbers of the real benchmark come from the
      # laptop (README, "Benchmark (M0)").
      - name: Demo smoke test (screenshots and short benchmark)
        shell: bash
        run: |
          mkdir -p demo-out
          run() {
            if [ "$RUNNER_OS" = "Linux" ]; then
              xvfb-run -a -s "-screen 0 1920x1080x24" cargo run -p sf_demo -- "$@"
            else
              cargo run -p sf_demo -- "$@"
            fi
          }
          run --shots demo-out
          ls -l demo-out
          for shot in close_up middle whole_map; do test -s "demo-out/$shot.png"; done
          run --bench --windowed --frames 300 --out demo-out/bench.json
          test -s demo-out/bench.json
          grep -q '"samples": 300' demo-out/bench.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: demo-smoke-${{ matrix.os }}
          path: demo-out/
          if-no-files-found: warn
      # Debug builds check integer overflow, release builds do not; sf_math
      # must give identical bits in both (golden hashes in tests/golden.rs).
      - name: sf_math golden hashes in release mode
        run: cargo test --release -p sf_math
      # sf_sim: the full-size determinism test (5000 wanderers, 10000 ticks) and
      # the committed golden checksums (tests/golden.rs) run in release mode, the
      # same values on Linux and Windows. `-p sf_sim` alone also builds sf_math
      # without its `render` feature, so sf_sim cannot even name render_bridge.
      - name: sf_sim determinism and golden checksums in release mode
        run: cargo test --release -p sf_sim
      - name: Clippy (release)
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --release --all-targets -- -D warnings
      - name: Determinism lint (sf_sim, sf_math)
        shell: bash
        run: scripts/check-sim-determinism.sh

  # WP1.3, milestone M0: the simulation must give the same checksums on Linux
  # and Windows. Each OS runs the headless scenarios in release mode and
  # requires the final checksum committed next to the scenario (--expect, so a
  # drift on one OS fails by itself); the logs are uploaded, and the compare job
  # below checks them against each other. Only sf_headless and its sim
  # dependencies are built here: no wgpu, no audio.
  headless:
    name: headless (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Run the scenarios (release) against the committed checksums
        shell: bash
        run: |
          mkdir -p headless-logs
          status=0
          for name in wander_5000 command_mix; do
            cargo run --release -p sf_headless -- "assets/scenarios/$name.ron" \
              --every 100 \
              --out "headless-logs/$name.json" \
              --expect "$(cat "assets/scenarios/$name.expected")" || status=1
          done
          exit $status
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: headless-logs-${{ matrix.os }}
          path: headless-logs/*.json
          if-no-files-found: warn

  headless-compare:
    name: headless checksums equal on Linux and Windows
    needs: headless
    # Also when one OS failed its own --expect: the comparison then shows
    # where the two logs part ways.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: headless-logs-*
          path: headless-logs
      - name: Compare the checksum lists (everything but the host block)
        run: |
          ls -R headless-logs
          scripts/compare-headless-logs.sh \
            headless-logs/headless-logs-ubuntu-latest \
            headless-logs/headless-logs-windows-latest
