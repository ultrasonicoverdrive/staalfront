name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - name: Software Vulkan driver (Mesa lavapipe) for the screenshot tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # --nocapture prints the adapter the screenshot tests used (lavapipe / WARP).
      - run: cargo test --workspace -- --nocapture
      # Debug builds check integer overflow, release builds do not; sf_math
      # must give identical bits in both (golden hashes in tests/golden.rs).
      - name: sf_math golden hashes in release mode
        run: cargo test --release -p sf_math
      # sf_sim: the full-size determinism test (5000 wanderers, 10000 ticks) and
      # the committed golden checksums (tests/golden.rs) run in release mode, the
      # same values on Linux and Windows. `-p sf_sim` alone also builds sf_math
      # without its `render` feature, so sf_sim cannot even name render_bridge.
      - name: sf_sim determinism and golden checksums in release mode
        run: cargo test --release -p sf_sim
      - name: Clippy (release)
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --release --all-targets -- -D warnings
      - name: Determinism lint (sf_sim, sf_math)
        shell: bash
        run: scripts/check-sim-determinism.sh
